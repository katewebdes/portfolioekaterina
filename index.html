<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Екатерина Яковленко</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Onest:wght@400;500&display=swap">
<style>
html{min-height:100%}
/* Layout: sticky profile card on the left, one quiet column of large case cards on the right; colour comes only from the covers. */
:root{
  --bg:#F4F3F0; --card:#FFFFFF; --line:rgba(0,0,0,.06); --line2:rgba(0,0,0,.1);
  --fg:#111111; --fg2:#6B6B6B; --fg3:#9A9A9A; --track:#E9E8E5; --soft:#F7F6F3;
  --btn:#111111; --btn-fg:#FFFFFF; --dot:rgba(0,0,0,.16);
  --shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04);
  --shadow-up:0 2px 4px rgba(0,0,0,.04),0 18px 44px rgba(0,0,0,.09);
  --glow:linear-gradient(180deg,transparent 0,transparent 5%,rgba(236,232,250,.6) 12%,rgba(226,217,248,.7) 16%,rgba(207,192,243,.7) 21%,rgba(188,168,238,.7) 25%,rgba(180,157,235,.7) 28%,rgba(188,168,238,.55) 33%,rgba(207,192,243,.35) 40%,rgba(226,217,248,.18) 48%,rgba(240,236,252,.06) 58%,transparent 68%); --glow2:linear-gradient(0deg,transparent 0,rgba(207,192,243,.16) 12%,rgba(188,168,238,.28) 24%,rgba(207,192,243,.2) 36%,rgba(226,217,248,.1) 50%,transparent 75%);
  --font:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050506; --card:#1B1B1B; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#F2F2F0; --fg2:#A3A3A0; --fg3:#74746F; --track:#232323; --soft:#202020;
  --btn:#F2F2F0; --btn-fg:#111111; --dot:rgba(255,255,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 18px 44px rgba(0,0,0,.5); --glow:linear-gradient(180deg,transparent 0,transparent 5%,rgba(8,20,30,.9) 12%,#20303f 16%,#3f5970 21%,#5f84a4 25%,#6d94b3 28%,rgba(95,132,164,.8) 33%,rgba(63,89,112,.5) 40%,rgba(32,48,63,.25) 48%,rgba(12,24,34,.08) 58%,transparent 68%); --glow2:linear-gradient(0deg,transparent 0,rgba(32,48,63,.3) 10%,rgba(95,132,164,.32) 24%,rgba(63,89,112,.2) 38%,rgba(32,48,63,.1) 52%,transparent 75%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050506; --card:#1B1B1B; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#F2F2F0; --fg2:#A3A3A0; --fg3:#74746F; --track:#232323; --soft:#202020;
  --btn:#F2F2F0; --btn-fg:#111111; --dot:rgba(255,255,255,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 18px 44px rgba(0,0,0,.5); --glow:linear-gradient(180deg,transparent 0,transparent 5%,rgba(8,20,30,.9) 12%,#20303f 16%,#3f5970 21%,#5f84a4 25%,#6d94b3 28%,rgba(95,132,164,.8) 33%,rgba(63,89,112,.5) 40%,rgba(32,48,63,.25) 48%,rgba(12,24,34,.08) 58%,transparent 68%); --glow2:linear-gradient(0deg,transparent 0,rgba(32,48,63,.3) 10%,rgba(95,132,164,.32) 24%,rgba(63,89,112,.2) 38%,rgba(32,48,63,.1) 52%,transparent 75%); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--glow) top/100% 180vh no-repeat,var(--glow2) bottom/100% 110vh no-repeat,var(--bg);color:var(--fg);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:14px 14px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,transparent 16%,transparent 84%,#000 100%);
          mask-image:linear-gradient(90deg,#000 0,transparent 16%,transparent 84%,#000 100%)}
a{color:inherit}
h1,h2,h3,p{margin:0;font-weight:400}
p,li,td,.card-desc,.lead{text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-block:40px 0}
.home{display:grid;grid-template-columns:300px minmax(0,560px);gap:72px;justify-content:center;align-items:start}

/* profile */
.profile{position:sticky;top:calc(40px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:20px}
.profile-top{display:flex;justify-content:space-between;align-items:flex-start}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--track)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;padding:0}
.icon-btn svg{width:16px;height:16px}
.name{font-size:26px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
.role{font-size:26px;line-height:1.2;color:var(--fg2);letter-spacing:-.01em}
.bio{color:var(--fg2)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:var(--card);text-decoration:none;font-weight:500;white-space:nowrap}
.pill.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.pill.sm{height:32px;padding:0 12px;font-size:13px}

/* tabs */
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--track);margin-bottom:24px}
.tab{height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--fg2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05)}
.tab small{font-size:12px;color:var(--fg3)}

/* case cards */
.feed{display:flex;flex-direction:column;gap:24px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:12px;box-shadow:var(--shadow);transition:box-shadow .3s ease}
.card:hover{box-shadow:var(--shadow-up)}
.cover{aspect-ratio:3/2;max-width:100%;border-radius:20px;overflow:hidden;background:var(--track)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .cover img{transform:scale(1.02)}
.card-body{padding:16px 8px 8px;display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title{font-size:22px;line-height:1.25;font-weight:500;letter-spacing:-.01em}
.card-title span{color:var(--fg2);font-weight:400}
.card-desc{color:var(--fg2)}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:6px}
.pairs{display:flex;gap:28px;flex-wrap:wrap}
.pair-l{font-size:12px;color:var(--fg3)}
.pair-v{font-size:20px;line-height:1.25}
.card .open::after{content:"";position:absolute;inset:0;border-radius:28px}
.card .site{position:relative;z-index:2}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.wait{opacity:0;transform:translateY(16px)}
.wait.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* about */
.about{display:flex;flex-direction:column;gap:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--shadow)}
.label{font-size:12px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.xp{display:flex;flex-direction:column;gap:20px}
.xp-row{display:flex;justify-content:space-between;gap:16px}
.xp-row b{font-weight:500}
.xp-row span{color:var(--fg3);white-space:nowrap}
.xp h3{font-size:15px;font-weight:500;margin-bottom:6px}
.xp ul,.case ul{margin:0;padding-left:18px;color:var(--fg2);display:flex;flex-direction:column;gap:6px}

/* case view */
.case{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.case-nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font-size:12px;color:var(--fg3);letter-spacing:.06em}
.case h1{font-size:clamp(28px,4.4vw,40px);line-height:1.15;font-weight:500;letter-spacing:-.02em;margin:8px 0 14px}
.lead{font-size:18px;color:var(--fg2);max-width:66ch}
.shot{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--track)}
.shot img{display:block;width:100%;height:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cell{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.cell p+p,.cell p+ul,.cell ul+p{margin-top:10px}
.cell .v{color:var(--fg)}
.cell .t{color:var(--fg2)}
.h2{font-size:26px;line-height:1.2;font-weight:500;letter-spacing:-.01em;margin-top:24px}
.h2 i{font-style:normal;color:var(--fg3);margin-right:10px;font-variant-numeric:tabular-nums}
.step-n{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums;margin-bottom:8px}
.step-t{font-size:18px;font-weight:500;line-height:1.3;margin-bottom:6px}
.para{color:var(--fg2);max-width:70ch}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:20px}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font-size:12px;font-weight:400;color:var(--fg3);letter-spacing:.06em;text-align:left;padding:14px 20px}
td{padding:14px 20px;border-top:1px solid var(--line);vertical-align:top;color:var(--fg2)}
td:first-child{color:var(--fg)}
b{font-weight:500;color:var(--fg)}
.stat-v{font-size:40px;line-height:1.1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;color:var(--fg2)}
.note{background:var(--soft)}
.boards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.board{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);padding:0;text-align:left}
.board img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top}
.board span{display:block;padding:10px 12px;font-size:13px;color:var(--fg2)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--w,220px),100%),1fr));gap:16px 12px;align-items:start}
.strip figure{margin:0}
.vids{display:grid;grid-template-columns:1.6fr .463fr;gap:12px;align-items:start}
.vids figure{margin:0}.vids video{display:block;width:100%;aspect-ratio:var(--ar);height:auto;border-radius:14px;border:1px solid var(--line);background:var(--track)}
.vids figcaption{font-size:13px;color:var(--fg2);padding:8px 2px 0}
@media(max-width:640px){.vids{grid-template-columns:1fr}.vids figure:last-child{max-width:240px}}
.strip.cap img{max-height:1000px;object-fit:cover;object-position:top}
.capnote{font-size:13px;color:var(--fg3)}
.strip img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.strip figcaption{font-size:13px;color:var(--fg2);padding:8px 2px 0}
.wide{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.wide figure{margin:0}
.wide img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.wide figcaption{font-size:13px;color:var(--fg2);padding:8px 2px 0}
.nav-r{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.photos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.photos img{display:block;width:100%;height:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px}
.next{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.next a{text-decoration:none}
.next .cell{transition:box-shadow .3s ease}
.next .cell:hover{box-shadow:var(--shadow-up)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;cursor:zoom-out}
.lb img{display:block;max-width:min(1400px,100%);margin:0 auto;border-radius:12px}
.lb button{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:20px;line-height:1}

footer{margin-top:72px;border-top:1px solid var(--line2);padding-block:28px 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer .who{font-weight:500}
footer p{color:var(--fg2)}
footer nav{display:flex;gap:20px;align-items:flex-start}
footer nav a{text-decoration:none;font-weight:500}

@media (max-width:900px){
  .page{padding-block:24px 0}
  .home{grid-template-columns:minmax(0,1fr);gap:28px;max-width:560px;margin:0 auto}
  .profile{position:static}
  .name,.role{font-size:24px}
  .card-foot{align-items:flex-start;flex-direction:column}
  .lead{font-size:16px}
  .stat-v{font-size:32px}
}
@media (prefers-reduced-motion:reduce){.rise{animation:none}.wait{opacity:1;transform:none}.cover img,.card,.wait.in{transition:none}}

.stat-v{line-height:1.02;margin-bottom:8px}
.cover{position:relative}.cvw{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.cvw img{transform:none!important}.card:hover .cvw{transform:scale(1.02)}
.ov{position:absolute;display:block;object-fit:cover;object-position:top;background:transparent}
.shot.has-ov{position:relative}
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));align-items:start}
.figs.sm{grid-template-columns:repeat(auto-fill,minmax(min(var(--w),100%),1fr))}
.crow .figs{margin-top:12px}
.figs figure,.chain figure,.mini figure{margin:0}
.figs button,.chain button,.mini button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);cursor:zoom-in}
.figs img,.chain img,.mini img{display:block;width:100%;height:auto}
.figs figcaption,.chain figcaption,.mini figcaption{font-size:13px;color:var(--fg2);padding:8px 2px 0}
.chain{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:0}
.chain-h{display:flex;gap:12px;align-items:baseline;margin-bottom:8px}
.chain-h .step-n{margin:0}.chain-h .step-t{margin:0;font-size:20px}
.crow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .k{font-size:12px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.crow .k b{display:block;font-weight:400;color:var(--fg3);font-variant-numeric:tabular-nums}
.crow.res .k{color:var(--fg)}
.crow ul{margin:0;padding-left:18px}.crow p+figure,.crow ul+figure{margin-top:12px}
.mini{display:grid;gap:12px}
.mini .cell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media(max-width:640px){.crow{grid-template-columns:1fr;gap:6px}.chain{padding:18px}.mini .cell{grid-template-columns:1fr}}
.lb.cv img{max-width:min(760px,100%);margin-top:24px}
.pv{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:var(--card);box-shadow:var(--shadow)}
.pv-bar{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.pv-dots{display:flex;gap:6px}.pv-dots i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.pv-back,.pv-home{height:28px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:0 10px;font-size:13px;color:var(--fg)}
.pv-back{width:28px;padding:0;font-size:18px;line-height:1}.pv-back:disabled{opacity:.35;cursor:default}
.pv-url{flex:1;min-width:0;height:28px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-view{position:relative;aspect-ratio:16/10;overflow-y:auto;overflow-x:hidden;background:#fff;overscroll-behavior:contain}
.pv-page{position:relative;container-type:inline-size}.pv-page img{display:block;width:100%;height:auto;user-select:none}
.pv-slice{position:relative;overflow:hidden}.pv-fix{position:sticky;z-index:2}.pv-fix.t{top:0}.pv-fix.b{bottom:0}.pv-slice>img{position:absolute;left:0;width:100%}
.pv-acc{position:relative;background:#fff;display:flex;align-items:flex-start}.pv-accc{position:relative;display:flex;flex-direction:column;background:inherit}.vcard{position:absolute;border-radius:14px;pointer-events:none;transition:background .25s,backdrop-filter .25s}.vcard.off{background:rgba(255,255,255,.72);-webkit-backdrop-filter:grayscale(1);backdrop-filter:grayscale(1)}.vfaq.t-vv{background:transparent;color:#353535;font-family:Manrope,system-ui,sans-serif}.vfaq.t-vv .vq{font-weight:500;letter-spacing:-.01em}.vfaq.t-vv .va{color:#707070}.vfaq.t-vv .vq i::before,.vfaq.t-vv .vq i::after{height:1px;background:#353535}.vfaq.t-vv.on .vq i::before{transform:rotate(45deg)}.vfaq.t-vv.on .vq i::after{transform:rotate(-45deg)}.pv-accl{position:absolute;left:0;top:0;background-repeat:no-repeat}
.vfaq{display:block;width:100%;background:#fff;border:0;text-align:left;cursor:pointer;font-family:Onest,Manrope,system-ui,sans-serif;color:#090909}
.vfaq .vq{display:flex;justify-content:space-between;align-items:center;font-weight:500;gap:16px}
.vfaq .vq i{position:relative;flex:none}.vfaq .vq i::before,.vfaq .vq i::after{content:"";position:absolute;left:12.5%;right:12.5%;top:50%;height:1.5px;margin-top:-.75px;background:#090909;transition:transform .2s}
.vfaq .vq i::after{transform:rotate(90deg)}.vfaq.on .vq i::after{transform:rotate(0)}
.vfaq .va{display:none;color:#5f5e5a;font-weight:400}.vfaq.on .va{display:block}
.vchip{position:absolute;border:0;border-radius:999px;background:#f3f2f2;color:#090909;font-family:Onest,Manrope,system-ui,sans-serif;font-weight:400;white-space:nowrap;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.vchip.on{background:#090909;color:#fff}
.vchk{position:absolute;border:1px solid #5f5e5a;border-radius:4px;background:#fff;padding:0;cursor:pointer}
.vchk.on{background:#4980ff;border-color:#4980ff}.vchk.on::after{content:"";position:absolute;left:32%;top:16%;width:28%;height:48%;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.hs{position:absolute;display:block;border-radius:6px;cursor:pointer}
.hs:hover{background:rgba(54,106,230,.12);box-shadow:inset 0 0 0 1.5px rgba(54,106,230,.6)}
.pv-page.flash .hs{animation:pvflash .9s ease}
@keyframes pvflash{0%,60%{background:rgba(54,106,230,.22);box-shadow:inset 0 0 0 1.5px rgba(54,106,230,.8)}100%{background:transparent;box-shadow:none}}
.proto-start{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#0b0b0d;cursor:pointer;display:block}
.proto-start img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:.7;display:block}
.proto-start span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;background:#fff;color:#111;font-weight:500;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pv-note{margin-top:-12px}

"]]}, {"type": "chain", "num": "01", "title": "Онлайн-бронь вместо WhatsApp", "rows": [{"k": "Проблема", "text": "Свободное время надо уточнять в WhatsApp"}, {"k": "Анализ", "text": "У 6 из 7 студий нет онлайн-брони: свободное время уточняют по звонку или в WhatsApp", "img": ["Конкуренты: матрица функций", "img/vv_matrix.jpg"]}, {"k": "Вывод", "text": "Онлайн-бронирование — главный разрыв рынка. Календарь со слотами и оплата на сайте вместо WhatsApp."}, {"k": "Решение", "text": "**Кнопка бронирования на каждой странице.** Свободные слоты видны сразу, без звонка и переписки"}, {"k": "Реализация", "img": ["Главная: Book now и Night bookings на первом экране", "img/vv_hero.jpg"]}]}, {"type": "chain", "num": "02", "title": "Прозрачная цена", "rows": [{"k": "Проблема", "text": "НДС всплывает при оплате"}, {"k": "Анализ", "list": ["НДС часто считают сверху, и итоговая сумма всплывает только при оплате", "Скрытый НДС — нечестный паттерн, подрывает доверие на этапе оплаты"], "img": ["Конкуренты: разбор Artphoto", "img/vv_artphoto.jpg"]}, {"k": "Вывод", "text": "Прозрачность = доверие. Цены, что входит в аренду и правила — до бронирования."}, {"k": "Решение", "text": "**Прозрачная цена.** НДС уже входит в стоимость, клиент сразу видит итоговую сумму"}, {"k": "Реализация", "img": ["Страница «Цены»", "img/vv_price.jpg"]}]}, {"type": "chain", "num": "03", "title": "Всё для решения до брони", "rows": [{"k": "Проблема", "text": "Непонятно, что входит в аренду"}, {"k": "Анализ", "text": "Ниже всего эмоции проседают на этапе сравнения: она открывает 3–5 сайтов и не может понять, сколько заплатит в итоге и поместится ли её съёмка в зал.", "img": ["CJM: этапы «Поиск», «Сравнение», «Бронирование»", "img/vv_cjm.jpg"]}, {"k": "Вывод", "text": "Если ответить на вопросы о цене, площади и составе аренды ещё на странице зала, студия выиграет выбор до бронирования."}, {"k": "Решение", "text": "**Всё для решения до брони.** На странице зала площадь, размеры циклорамы, цена за час, оборудование и правила отмены"}, {"k": "Реализация", "img": ["Страница зала: площадь, цена за час, бронь", "img/vv_hall.jpg"]}]}, {"type": "chain", "num": "04", "title": "Примеры съёмок под задачу", "rows": [{"k": "Проблема", "text": "Сложно оценить зал по фото"}, {"k": "Анализ", "list": ["Фото зала слабые или их нет совсем", "Въезд для авто и крупного реквизита не заявлен ни у кого"], "img": ["JTBD: выбор локации и съёмка с авто", "img/vv_jtbd_props.jpg"]}, {"k": "Вывод", "text": "Въезд авто — главное отличие. Показать его отдельным сценарием съемки на странице зала."}, {"k": "Решение", "text": "**Примеры съёмок под задачу.** Каталоги, крупный реквизит и авто, предметка: клиент видит съёмку, похожую на свою, а не пустой зал"}, {"k": "Реализация", "img": ["Страница зала: съёмки с крупным реквизитом", "img/vv_props.jpg"]}]}, {"type": "mini", "label": "ЕЩЁ РЕШЕНИЯ", "rows": [["Ночные брони и мероприятия усложняют путь", "**Отдельные сценарии через администратора.** Кнопка ночной брони и заявка на мероприятие с форматами в поп-апах", ["Мероприятия: форматы с поп-апами", "img/vv_events.jpg"]]]}, {"type": "heading", "title": "Дизайн и UI-кит"}, {"type": "cols", "items": [{"label": "ВИЗУАЛЬНЫЙ СТИЛЬ", "text": "Палитра опирается на интерьер студии. На итерации мы добавили цвет из зала, чтобы сайт и помещение воспринимались как один бренд. Заголовки капсом оставили только на главной как акцент: на внутренних страницах они мешали читать."}, {"label": "СИСТЕМА И СБОРКА", "text": "Сайт адаптирован под десктоп, планшет и телефон, анимации собраны в Tilda. В Figma я веду UI-кит: каждую доработку сначала отрисовываю там, согласую с клиентом и только потом переношу на сайт."}]}, {"type": "cols", "items": [{"label": "КОМПРОМИСС", "text": "В SimplyBook клиент сначала выбирает количество часов и только потом видит календарь. Я предложила доработать виджет с разработчиком, но клиент выбрал стандартный без дополнительного бюджета. Поэтому всё, что влияет на решение, я вынесла на сайт до перехода .0, "h": 78.125, "r": "2.45%/3.2%"}, {"img": "img/vivete_phone.png", "l": 73.0, "t": 33.5, "w": 18.3333, "h": 58.625}]}, {"slug": "tbank", "name": "Т-Банк Premium", "industry": "Офлайн-интерфейсы", "url": null, "kicker": "КЕЙС · ОФЛАЙН-ИНТЕРФЕЙСЫ · КИОСК И ФОТОБУДКА", "title": "Т-Банк Premium: сенсорный киоск и фотобудка для поп-апа на Роза Хуторе", "lead": "За 3 недели спроектировала сценарии и экраны для поп-апа Т-Банк Premium на Роза Хуторе. На интерактивном экране гость узнаёт о привилегиях и уровнях Premium и находит на карте точки партнёров с кэшбэком. В фотобудке делает серию снимков в стиле кампании «Комфорт на любой высоте» и сразу печатает их.", "desc": "За 3 недели спроектировала сценарии и экраны для поп-апа Т-Банк Premium на Роза Хуторе.", "pairs": [["Срок", "3 недели"], ["Формат", "Киоск и фотобудка"]], "blocks": [{"type": "meta", "items": [{"label": "РОЛЬ", "value": "Сценарии и UI интерактивного экрана в концепции арт-директора, визуал и тексты фотобудки в концепции бренда, ТЗ разработчику на анимации и поведение экранов"}, {"label": "СРОК", "value": "3 недели на весь проект"}, {"label": "КОМАНДА", "value": "Арт-директор, иллюстратор, разработчик · агентство «Фигура Фон»"}]}, {"type": "cols", "items": [{"label": "КОНТЕКСТ", "text": "Т-Банк открыл поп-ап Premium на курорте Роза Хутор. Вертикальный сенсорный экран встроен в стену лаунжа рядом с зоной отдыха, фотобудка стоит отдельно. Клиент дал бренд-материалы, 3D-рендеры уровней Premium и данные о привилегиях и точках на карте, а визуальную концепцию интерактивного экрана задал арт-директор."}, {"label": "ЗАДАЧА", "text": "Рассказать гостям курорта о сервисе и привилегиях Premium и вовлечь их во взаимодействие с брендом. Моя зона — сценарии и экраны интерактивного экрана и фотобудки."}]}, {"type": "heading", "title": "Как я решила задачу"}, {"type": "steps", "items": [{"num": "01", "title": "Пересобрала сайт под вертикальный экран", "text": "Структуру привилегий и уровней с сайта Premium разложила на обзорный экран и поп-апы"}, {"num": "02", "title": "Сделала экраны понятными с первого касания", "text": "Гость разбирается сам, а с вопросами может подойти к персоналу поп-апа"}, {"num": "03", "title": "Адаптировала макеты под монтаж", "text": "Экран смонтировали ниже, чем в макетах. Я подняла текст в удобную для чтения зону, а низ экрана отдала под иллюстрацию"}]}, {"type": "heading", "title": "Какие сценарии я спроектировала"}, {"type": "steps", "items": [{"num": "Киоск · 1", "title": "Знакомство с Premium", "text": "Экран ожидания → касание → экран входа → обзор привилегий и уровней → поп-ап с подробностями уровня"}, {"num": "Киоск · 2", "title": "Поиск точек на карте", "text": "Экран входа → карта курорта с кластерами → приближение → точки с иконками категорий → карточка партнёра"}, {"num": "Фотобудка", "title": "Съёмка и печать фото", "text": "Старт → отсчёт и съёмка четырёх кадров → просмотр → выбор фильтра → печать"}]}, {"type": "heading", "num": "01", "title": "Ограничения площадки и решения"}, {"type": "chain", "num": "01", "title": "Обзорный экран и поп-апы уровней", "rows": [{"k": "Ограничение", "text": "Подробностей много, а экран один и вертикальный. Структуру с сайта Premium нельзя перенести как есть: экран читают стоя и с расстояния"}, {"k": "Решение", "text": "**Обзорный экран и поп-апы уровней.** Основной экран показывает обзор привилегий и уровней Premium, а подробности каждого уровня открываются в поп-апе. Так экран не превращается в длинный сайт"}, {"k": "Реализация", "imgs": [["Экран продукта", "img/tbank_m_03.jpg"], ["Bronze", "img/tbank_m_06.jpg"], ["Silver", "img/tbank_m_07.jpg"], ["Gold", "img/tbank_m_08.jpg"], ["Diamond", "img/tbank_m_09.jpg"]], "w": 110}]}, {"type": "chain", "num": "02", "title": "Кластеры → точки → карточка партнёра", "rows": [{"k": "Ограничение", "text": "Десятки точек на карте перекроют друг друга: прокат, рестораны, кассы, спорттовары, достопримечательности и подписи о кэшбэке"}, {"k": "Решение", "text": "**Кластеры → точки → карточка партнёра.** На общем плане точки собраны в кластеры с цифрой. При приближении кластер распадается на точки с иконками категорий, а по тапу открывается карточка партнёра, которую я отрисовала. Анимацию карты описала разработчику в ТЗ"}, {"k": "Реализация", "imgs": [["Карта в отдалении", "img/tbank_m_04.jpg"], ["Карточка объекта на карте", "img/tbank_m_05.jpg"]], "w": 180}]}, {"type": "chain", "num": "03", "title": "Экран ожидания и экран входа", "rows": [{"k": "Ограничение", "text": "Экран встроен в стену у зоны отдыха, и гость должен сразу понять, что он интерактивный"}, {"k": "Решение", "text": "**Экран ожидания и экран входа.** На экране ожидания анимированная подсказка зовёт коснуться экрана, после касания открывается экран входа с меню из двух разделов. Анимацию я описала разработчику текстом, чтобы уложиться в сроки"}, {"k": "Реализация", "imgs": [["Экран ожидания", "img/tbank_m_01.jpg"], ["Экран входа", "img/tbank_m_02.jpg"]], "w": 180}]}, {"type": "chain", "num": "04", "title": "Экраны фотобудки с подсказками и обратным отсчётом", "rows": [{"k": "Ограничение", "text": "Гость проходит фотобудку сам: четыре кадра, просмотр, выбор фильтра и печать. Ему нужно понимать, на каком он шаге и когда будет снимок"}, {"k": "Решение", "text": "**Экраны с подсказками и обратным отсчётом.** Я задизайнила все экраны фотобудки, написала тексты и разметила, где на экранах будут элементы. Перед каждым кадром идёт отсчёт, а короткие подсказки в тоне кампании «Комфорт на любой высоте» ведут гостя от старта до печати"}, {"k": "Реализация", "imgs": [["Старт", "img/tbank_d_01.jpg"], ["Съёмка, кадр 1", "img/tbank_d_09.jpg"], ["Съёмка, кадр 2", "img/tbank_d_10.jpg"], ["Съёмка, кадр 3", "img/tbank_d_11.jpg"], ["Съёмка, кадр 4", "img/tbank_d_12.jpg"], ["Просмотр", "img/tbank_d_06.jpg"], ["Фильтр", "img/tbank_d_07.jpg"], ["Финал", "img/tbank_d_08.jpg"]], "w": 200}]}, {"type": "heading", "num": "02", "title": "Адаптация под монтаж"}, {"type": "chain", "num": "05", "title": "Адаптировала макеты под монтаж", "rows": [{"k": "Что случилось", "text": "Высоту экрана согласовали заранее, но при монтаже нишу вырезали ниже, чем было в макетах. Людям среднего роста стало неудобно читать текст, а перевесить экран было нельзя: он встроен в стену."}, {"k": "Что я сделала", "text": "Я была на площадке и предложила поднять текст в удобную зону, а низ экрана отдать под иллюстрацию. Оперативно поправила макеты, и разработчик внедрил правку."}, {"k": "На площадке", "imgs": [["", "img/v3_tbank_photo_1.jpg"], ["", "img/v3_tbank_photo_3.jpg"], ["", "img/v3_tbank_photo_4.jpg"], ["", "img/v3_tbank_photo_5.jpg"]], "w": 150}]}, {"type": "proto", "device": "kiosk", "title": "Прототип", "text": "Кликабельный прототип вертикального экрана: экран ожидания, вход, привилегии и поп-апы уровней Premium, карта курорта от кластеров к точкам и карточке партнёра. Коснитесь экрана, чтобы начать.", "site": "Т-Банк Premium", "start": "wait", "poster": "img/tb/wait.jpg", "screens": {"wait": {"img": "img/tb/wait.jpg", "w": 1080, "h": 1920, "path": "Экран ожидания", "hs": [[0.0, 0.0, 100.0, 100.0, "entry"]]}, "entry": {"img": "img/tb/entry.jpg", "w": 1080, "h": 1920, "path": "Экран входа", "hs": [[26.204, 42.708, 47.593, 6.25, "map"], [26.204, 50.781, 47.593, 6.25, "product"], [0.0, 0.0, 100.0, 39.583, "wait"]]}, "product": {"img": "img/tb/product.jpg", "w": 1081, "h": 4998, "path": "Привилегии Premium", "hs": [[81.869, 1.401, 12.951, 0.9, "entry"], [4.625, 36.214, 22.202, 16.206, "bronze"], [27.752, 36.214, 22.202, 16.206, "silver"], [50.879, 36.214, 22.202, 16.206, "gold"], [74.006, 36.214, 22.202, 16.206, "diamond"]]}, "bronze": {"img": "img/tb/bronze.jpg", "w": 1080, "h": 2772, "path": "Premium Bronze", "hs": [[0.0, 0.0, 100.0, 8.297, "back"], [70.37, 7.215, 9.259, 3.247, "back"], [0.0, 56.277, 100.0, 43.723, "back"]]}, "silver": {"img": "img/tb/silver.jpg", "w": 1080, "h": 2772, "path": "Premium Silver", "hs": [[0.0, 0.0, 100.0, 8.297, "back"], [70.37, 7.215, 9.259, 3.2  "3 недели", "label": "от сценариев до работающих экранов"}, {"value": "3 сценария", "label": "на интерактивном экране и в фотобудке"}, {"value": "30 минут", "label": "от проблемы на монтаже до исправленного экрана"}]}, {"type": "note", "label": "", "text": "Интерактивный экран и фотобудка работали в поп-апе Т-Банк Premium на Роза Хуторе."}], "figma": "https://www.figma.com/design/qkhOKaYTyfJipLsnqB1kEY/%D0%A2-%D0%B1%D0%B0%D0%BD%D0%BA?node-id=1-2&t=X8skdLuiIkOfvkR8-1", "strips": [], "cover": "img/v3_tbank_card.jpg", "shots": [], "photos": [], "boards": []}, {"slug": "voltex", "name": "Вольтэкс", "industry": "E-commerce", "url": null, "kicker": "КЕЙС · E-COMMERCE · B2C + B2B", "title": "Вольтэкс: магазин вместо технического справочника", "lead": "За месяц спроектировала и собрала магазин производителя литиевых аккумуляторов. Частный покупатель сам подбирает модель и оплачивает её онлайн в 3 шага, а компании и инженеры покупают по счёту или заказывают сборку по ТЗ.", "desc": "За месяц спроектировала и собрала магазин производителя литиевых аккумуляторов.", "pairs": [["Срок", "1 месяц"], ["Формат", "B2C + B2B"]], "blocks": [{"type": "meta", "items": [{"label": "РОЛЬ", "value": "Единственный дизайнер: исследование, UX, UI, сборка на Tilda, подключение оплаты"}, {"label": "СРОК", "value": "1 месяц от исследования до запуска"}, {"label": "ПЛАТФОРМЫ", "value": "Десктоп, планшет, мобильный · Tilda"}]}, {"type": "cols", "items": [{"label": "КОНТЕКСТ", "text": "Вольтэкс собирает литиевые аккумуляторы и раньше продавал их в основном перекупщикам. Часть B2B-клиентов ушла к китайским поставщикам, и компания решила выйти к частным покупателям: владельцам лодок, электротранспорта и дронов. Старый сайт для этого не подходил: много технической информации, запутанная навигация, мало заявок."}, {"label": "ЗАДАЧА", "text": "Сделать магазин, где частный покупатель находит и оплачивает аккумулятор без звонка менеджеру, и при этом сохранить сценарии для B2B: оплату по счёту и заказ сборки по ТЗ. Два сценария не должны мешать друг другу."}]}, {"type": "heading", "title": "Как я решила задачу"}, {"type": "steps", "items": [{"num": "01", "title": "Нашла пробел на рынке", "text": "Конкуренты умеют собирать аккумуляторы под заказ, но не умеют продавать их онлайн"}, {"num": "02", "title": "Определила главный барьер", "text": "Доверие к незнакомому производителю, когда чек высокий"}, {"num": "03", "title": "Развела два сценария", "text": "Розница покупает готовое онлайн, B2B и инженеры оплачивают по счёту и заказывают по ТЗ"}]}, {"type": "heading", "num": "01", "title": "Пробел на рынке"}, {"type": "p", "text": "Я разобрала сайты 5 производителей (Battka, Neter, Virtustec, Li-force, Titanat) и открытые источники, а также опиралась на то, что заказчик знает о своих покупателях. Интервью провести не было возможности, поэтому выводы я сформулировала как гипотезы для проверки на юзабилити-тестах."}, {"type": "cols", "items": [{"label": "", "list": ["У Battka и Titanat онлайн-оплаты нет, только счёт", "У Neter есть корзина, но в подвале написано, что сайт «носит информационный характер»", "У Li-force гарантию видно только в корзине, а поля характеристик в карточках пустые"]}]}, {"type": "fig", "items": [["Анализ конкурентов: матрица функций", "img/vx_matrix.jpg"]]}, {"type": "note", "label": "ВЫВОД", "text": "Ни у одного конкурента нет полного набора: онлайн-оплата, заказ по ТЗ, гарантия и документы на виду"}, {"type": "heading", "num": "02", "title": "Главный барьер — доверие"}, {"type": "cols", "items": [{"label": "СЕГМЕНТЫ И ПЕРСОНЫ", "text": "Я выделила 4 сегмента. Основные: частные владельцы техники и заказчики сборки по ТЗ. Вторичные: компании и владельцы компактной техники. Логика покупки у них разная: частник выбирает и сразу платит, инженер сначала согласовывает параметры и сроки. По сегментам собрала 4 протоперсоны. Компаниям отдельная персона не понадобилась: их закрывает тот же каталог с оплатой по счёту."}]}, {"type": "fig", "items": [["Аудитория", "img/voltex_board_01.jpg"], ["Персоны", "img/voltex_board_03.jpg"]]}, {"type": "cols", "items": [{"label": "JTBD И CJM", "text": "Я описала задачи, ради которых покупатель приходит на сайт, и построила CJM для основной персоны, владельца моторной лодки. Сильнее всего его эмоции проседают на этапе проверки доверия: чек высокий, производитель незнакомый, а гарантию конкуренты показывают в лучшем случае на последнем шаге."}]}, {"type": "fig", "items": [["JTBD", "img/voltex_board_04.jpg"], ["CJM", "img/voltex_board_05.jpg"]]}, {"type": "note", "label": "ГИПОТЕЗА", "text": "Если показать гарантию и сертификаты до корзины, а не на последнем шаге, меньше покупателей уйдёт перед оплатой."}, {"type": "heading", "num": "03", "title": "Решения"}, {"type": "fig", "items": [["User flow", "img/voltex_board_06.jpg"], ["Инф. архитектура", "img/voltex_board_07.jpg"]]}, {"type": "chain", "num": "01", "title": "Доверие до корзины", "rows": [{"k": "Проблема", "text": "Гарантия спрятана в корзину"}, {"k": "Анализ", "text": "Сильнее всего его эмоции проседают на этапе проверки доверия: чек высокий, производитель незнакомый, а гарантию конкуренты показывают в лучшем случае на последнем шаге.", "img": ["CJM: этапы «Выбор модели», «Проверка доверия», «Покупка»", "img/vx_cjm_trust.jpg"]}, {"k": "Вывод", "text": "Если показать гарантию и сертификаты до корзины, а не на последнем шаге, меньше покупателей уйдёт перед оплатой."}, {"k": "Решение", "text": "**Доверие до корзины.** Блок «Гарантия и документы» на главной и в карточке товара"}, {"k": "Реализация", "img": ["Главная: блок «Гарантия и документы»", "img/vx_guarantee.jpg"]}]}, {"type": "chain", "num": "02", "title": "Два способа оплаты", "rows": [{"k": "Проблема", "text": "Оплатить можно только по счёту через менеджера"}, {"k": "Анализ", "list": ["У Battka и Titanat онлайн-оплаты нет, только счёт", "У Neter есть корзина, но в подвале написано, что сайт «носит информационный характер»"]}, {"k": "Вывод", "text": "Логика покупки у них разная: частник выбирает и сразу платит, инженер сначала согласовывает параметры и сроки."}, {"k": "Решение", "text": "**Два способа оплаты.** Карта и СБП для частных покупателей, счёт для юрлиц. Путь к оплате — 3 шага: корзина, оформление, оплата"}, {"k": "Реализация", "img": ["Оформление заказа", "img/vx_checkout.jpg"]}]}, {"type": "chain", "num": "03", "title": "Заказ по ТЗ", "rows": [{"k": "Проблема", "text": "Непонятно, как заказать нестандартный аккумулятор"}, {"k": "Анализ", "text": "Конкуренты умеют собирать аккумуляторы под заказ, но не умеют продавать их онлайн."}, {"k": "Вывод", "text": "Розница покупает готовое онлайн, B2B и инженеры оплачивают по счёту и заказывают по ТЗ."}, {"k": "Решение", "text": "**Отдельная страница заказа по ТЗ.** Загрузка файла, сроки (3–14 дней, сложные проекты до 30), этапы работы. Ведут на неё главная, каталог, статьи и пустая корзина"}, {"k": "Реализация", "img": ["Страница «Заказ по ТЗ»", "img/vx_tz.jpg"]}]}, {"type": "chain", "num": "04", "title": "Понятная карточка", "rows": [{"k": "Проблема", "text": "Характеристики разбросаны или не заполнены"}, {"k": "Анализ", "text": "У Li-force гарантию видно только в корзине, а поля характеристик в карточках пустые"}, {"k": "Решение", "text": "**Понятная карточка.** Напряжение, ёмкость и энергия крупно наверху, полная таблица ниже"}, {"k": "Реализация", "img": ["Карточка товара", "img/vx_card.jpg"]}]}, {"type": "mini", "label": "ЕЩЁ РЕШЕНИЯ", "rows": [["Покупатель не знает, с чего начать", "**Быстрый подбор на первом экране.** Указал напряжение и ёмкость и сразу попал в каталог с подходящими моделями", ["Главная: быстрый подбор", "img/vx_hero.jpg"]], ["Дубли товаров в выпадающих меню", "**Один каталог.** Область применения (лодки, электротранспорт, дроны) выбирается фильтром", ["Каталог с фильтрами", "img/vx_catalog.jpg"]], ["Ошибка обрывает покупку", "**Запасные пути.** Если оплата не прошла, заказ сохраняется. Из пустой корзины можно перейти в каталог или к заказу по ТЗ. На случай повре t": "Сделать сайт, который помогает заказчику быстро понять, чем занимается бюро, оценить его проекты и оставить заявку."}]}, {"type": "heading", "title": "Как я решила задачу"}, {"type": "steps", "items": [{"num": "01", "title": "Нашла пробелы у конкурентов", "text": "У 4 из 5 бюро нет чёткого позиционирования, а форма связи есть только у одного"}, {"num": "02", "title": "Определила точку потери", "text": "Момент обращения: портфолио заинтересовало, но оставить заявку негде"}, {"num": "03", "title": "Дала аргументы и короткий путь", "text": "Факты для согласования с руководством и «Обсудить проект» прямо на странице проекта"}]}, {"type": "heading", "num": "01", "title": "Пробелы у конкурентов"}, {"type": "p", "text": "Исследование я построила на брифе заказчика и анализе сайтов 5 архитектурных бюро: Archidica, A4, СПИЧ, Basis и IND. Интервью не проводились, поэтому выводы оформила как гипотезы."}, {"type": "cols", "items": [{"label": "ЧТО НАШЛА", "list": ["Все конкуренты выглядят надёжно и подкрепляют это проектами и наградами", "У 4 из 5 нет чёткого позиционирования: с первого экрана непонятно, чем занимается бюро", "Форма связи есть только у одного бюро, остальным нужно писать на почту или звонить", "Сильный контент теряется, когда навигация перегружена"]}]}, {"type": "fig", "items": [["Анализ конкурентов: 5 архитектурных бюро", "img/strata_board_02.jpg"]]}, {"type": "cols", "items": [{"label": "КТО ВЫБИРАЕТ БЮРО", "text": "**Основные сегменты:** девелоперы жилой и коммерческой недвижимости и госзаказчики, которые ищут подрядчика для благоустройства и общественных пространств.\n\n**Вторичные:** корпоративные клиенты (офисы, музеи, выставки) и пресса с партнёрами.\n\nБюро выбирают долго и коллегиально: заказчик составляет шорт-лист и обосновывает выбор перед руководством."}]}, {"type": "fig", "items": [["Аудитория", "img/strata_board_01.jpg"]]}, {"type": "heading", "num": "02", "title": "Точка потери — обращение"}, {"type": "p", "text": "Я собрала 3 протоперсоны, описала их задачи через JTBD и построила CJM для руководителя проектов в девелоперской компании. Самая низкая точка — момент обращения: портфолио уже заинтересовало, но формы нет, и заказчик теряется между почтой и телефоном."}, {"type": "fig", "items": [["Персоны", "img/strata_board_03.jpg"], ["JTBD", "img/strata_board_04.jpg"]]}, {"type": "fig", "items": [["CJM: руководитель проектов у девелопера", "img/strata_board_05.jpg"]]}, {"type": "note", "label": "ГИПОТЕЗА", "text": "Если поставить призыв «Обсудить проект» прямо на странице проекта, интерес к портфолио превратится в заявку."}, {"type": "heading", "num": "03", "title": "Решения"}, {"type": "fig", "items": [["User flow", "img/strata_board_06.jpg"], ["Инф. архитектура", "img/strata_board_07.jpg"]]}, {"type": "chain", "num": "01", "title": "Позиционирование на первом экране", "rows": [{"k": "Проблема", "text": "Непонятно, чем занимается бюро"}, {"k": "Анализ", "text": "У 4 из 5 нет чёткого позиционирования: с первого экрана непонятно, чем занимается бюро", "img": ["Анализ конкурентов: главный вывод и матрица", "img/st_matrix.jpg"]}, {"k": "Вывод", "text": "**Позиционирование на первом экране.** Сразу сказать, что делает бюро: здания, благоустройство, интерьеры."}, {"k": "Решение", "text": "**Позиционирование на первом экране.** Здания, благоустройство и интерьеры видны сразу. Услуги собраны в блок на главной, поэтому в меню всего 5 разделов"}, {"k": "Реализация", "img": ["Главная: первый экран", "img/st_hero.jpg"]}]}, {"type": "chain", "num": "02", "title": "«Обсудить проект» на странице проекта", "rows": [{"k": "Проблема", "text": "Негде оставить заявку"}, {"k": "Анализ", "text": "Самая низкая точка — момент обращения: портфолио уже заинтересовало, но формы нет, и заказчик теряется между почтой и телефоном.", "list": ["Форма связи есть только у одного бюро, остальным нужно писать на почту или звонить"], "img": ["CJM: этапы «Проверка экспертизы» — «Обсуждение»", "img/st_cjm_contact.jpg"]}, {"k": "Вывод", "text": "Если поставить призыв «Обсудить проект» прямо на странице проекта, интерес к портфолио превратится в заявку."}, {"k": "Решение", "text": "**Призыв к связи в нескольких точках.** «Обсудить проект» на странице проекта и в футере, форма обратной связи в контактах"}, {"k": "Реализация", "img": ["Страница проекта: «Есть похожая задача?» и форма в «Контактах»", "img/st_cta.jpg"]}]}, {"type": "chain", "num": "03", "title": "Фильтры проектов", "rows": [{"k": "Проблема", "text": "Приходится листать всё портфолио"}, {"k": "Анализ", "text": "Составляет шорт-лист из 3–5 бюро, сравнивает реализованные объекты, согласует решение с руководством", "img": ["JTBD: функциональные работы", "img/st_jtbd.jpg"]}, {"k": "Решение", "text": "**Фильтры проектов по категориям.** Девелопер сразу видит опыт в своём типе объектов"}, {"k": "Реализация", "img": ["Проекты: фильтры по категориям", "img/st_projects.jpg"]}]}, {"type": "chain", "num": "04", "title": "Аргументы для согласования", "rows": [{"k": "Проблема", "text": "Нечем обосновать выбор перед руководством"}, {"k": "Анализ", "text": "Бюро выбирают долго и коллегиально: заказчик составляет шорт-лист и обосновывает выбор перед руководством.", "list": ["Смотрит на госпроекты, награды и профессиональную репутацию — нужны факты для обоснования"]}, {"k": "Вывод", "text": "**Доверие из фактов.** Проекты, награды, команда, цифры и новости — то, что работает у сильнейших конкурентов."}, {"k": "Решение", "text": "**Аргументы для согласования.** Ключевые цифры на главной, таблица наград, этапы работы и команда в «О бюро». Статья о награде ведёт на страницу объекта"}, {"k": "Реализация", "img": ["О бюро: награды и этапы работы", "img/st_about.jpg"]}]}, {"type": "mini", "label": "ЕЩЁ РЕШЕНИЯ", "rows": [["По картинкам не понять подход бюро", "**Страница проекта как разбор решений.** На первом экране категория, город, год, статус и площадь. Ниже концепция, фасад, интерьер, планировка и команда проекта", ["Страница проекта: первый экран и концепция", "img/st_project.jpg"]]]}, {"type": "heading", "title": "Дизайн и UI-кит"}, {"type": "cols", "items": [{"label": "ВИЗУАЛЬНЫЙ СТИЛЬ", "text": "Заказчик хотел современный минималистичный сайт, поэтому в основе чёрный, белый и серый, а главное место отдано фотографиям проектов. Сайт спроектирован для десктопа и мобильных, на русском и английском."}, {"label": "ИТЕРАЦИЯ СТРУКТУРЫ", "text": "В процессе пересмотрели контент: отдельный раздел наград убрали, материалы о наградах перенесли в новости и добавили фильтр по типу публикаций, чтобы информация не рассыпалась по разным страницам."}]}, {"type": "fig", "items": [["Новости: фильтр по типу публикаций", "img/st_news.jpg"], ["Статья о награде", "img/st_award.jpg"]]}, {"type": "cols", "items": [{"label": "ПЕРЕДАЧА В РАЗРАБОТКУ", "text": "Разработчик получил макеты всех страниц, UI-кит и комментарии к макетам."}, {"label": "AI В РАБОТЕ", "text": "Изображения для макетов я генерировала в Nano Banana, тексты писала с помощью ChatGPT и Claude."}]}, {"type": "shot", "title": "Ключевые экраны", "src": "img/v3_strata_key.jpg"}, {"type": "proto", "title": "Прототип", "text": "Кликабельный прототип сайта бюро: проекты, страница проекта, о бюро, новости и статья о награде, контакты с формой заявки. Путь «портфолио → «Обсудить проект» → заявка» проходится целиком.", "site": "strata.ru", "start": "home", "poster": "img/st/home.jpg", "screens": {"home": {"img": "img/st/home.jpg", "w": 1920, "h": 7376, "path": "", "hs": [[2.083, 0.678, 10.417, 0.813, "home"], [69.01, 0.746, 2.865, 0.678, "!Сайт двуязычный: здесь переключается RU / EN"], [73.438, 0.746, 5.469, 0.678, "projects"], [79.948, 0.746, 4.531, 0.678, "about"], [85.417, 0.746, 5.833, 0.678, "contacts"], [92.188, 0.746, 5.625, 0.678, "news"], [50.0, 3.999, 10.938, 0.746, "projects"], [90.104, 16.811, 7.552, 0.678, "projects"], [2.604, 17.977, 22.917, 8.812, "project"], [26.562, 17.977, 22.917, 8.812, "project"], [50.521, 17.977, 22.76, 8.812, "project"], [74.479, 17.977, 22.76, 8. , 95.312, 2.878, "contacts"]]}}}, {"type": "shot", "title": "UI-кит", "src": "img/v3_strata_kit.jpg"}, {"type": "heading", "title": "Результат"}, {"type": "cols", "items": [{"label": "ДЛЯ ЗАКАЗЧИКОВ БЮРО", "list": ["Чем занимается бюро, видно с первого экрана", "Похожие проекты находятся в пару кликов", "Аргументы для руководства собраны в одном месте", "Заявку можно оставить прямо со страницы проекта"]}, {"label": "ДЛЯ БЮРО", "text": "Макеты всех страниц, UI-кит и комментарии переданы разработчику. Запуск запланирован на декабрь 2026."}]}, {"type": "note", "label": "ЧТО БУДЕМ ОТСЛЕЖИВАТЬ ПОСЛЕ ЗАПУСКА", "text": "Конверсию из посещения в заявку, количество заявок со страниц проектов и переходы в контакты. Так проверим главную гипотезу: превращает ли призыв на странице проекта интерес в заявку."}], "figma": "https://www.figma.com/design/FMwINwR9ykreo7O37sKl3T/%D0%90%D1%80%D1%85%D0%B8%D1%82%D0%B5%D0%BA%D1%82%D1%83%D1%80%D0%BD%D0%BE%D0%B5-%D0%91%D1%8E%D1%80%D0%BE-Strata?node-id=13-896&t=5eFxPQqp2i8KEGLR-1", "strips": [], "cover": "img/v3_strata_card.jpg", "shots": [], "photos": [], "boards": []}, {"slug": "loca", "name": "LOCA", "industry": "Мобильное приложение", "url": null, "kicker": "КЕЙС · МОБИЛЬНОЕ ПРИЛОЖЕНИЕ · КОНЦЕПТ", "title": "LOCA: приложение, в котором компания друзей договаривается, куда пойти", "lead": "Спроектировала мобильное приложение для поиска мест и совместных планов. Человек находит место под настроение через AI-ассистента, а компания друзей собирает предпочтения, голосует к сроку и получает готовый план встречи — без недельной переписки в чате.", "desc": "Спроектировала мобильное приложение для поиска мест и совместных планов.", "pairs": [["Формат", "Концепт"]], "blocks": [{"type": "meta", "items": [{"label": "РОЛЬ", "value": "Продуктовый дизайнер, полный цикл: интервью, кабинетное исследование, позиционирование, IA, user flow, UI, прототип"}, {"label": "ФОРМАТ", "value": "Концепт мобильного приложения для России · данные о местах через API 2ГИС"}, {"label": "ПЛАТФОРМА", "value": "iOS · Figma"}]}, {"type": "cols", "items": [{"label": "КОНТЕКСТ", "text": "Когда друзья решают, куда пойти, каждый кидает в чат ссылки из карт, половина молчит, и обсуждение расползается. В итоге выбирает организатор — и он же виноват, если не понравилось. Карты рассчитаны на одного человека, а трип-планеры помогают спланировать поездку, но не доводят группу до решения."}, {"label": "ЗАДАЧА", "text": "Сделать приложение с двумя режимами, которые не мешают друг другу: «я ищу место» — быстрый поиск под настроение и бюджет, и «мы выбираем вместе» — совместный план, который заканчивается решением к сроку."}]}, {"type": "heading", "title": "Как я решила задачу"}, {"type": "steps", "items": [{"num": "01", "title": "Нашла незанятую нишу", "text": "Поиск, списки и даже голосование у конкурентов есть по отдельности, но никто не доводит группу до решения"}, {"num": "02", "title": "Развела два режима", "text": "Личное живет в «Мои места → Личные», групповое — в «Совместные», AI — в отдельной вкладке"}, {"num": "03", "title": "Довела выбор до итога", "text": "Вход по имени, предпочтения за минуту, голосование со сроком и решающий голос организатора при ничьей"}]}, {"type": "heading", "num": "01", "title": "Исследование"}, {"type": "p", "text": "Я провела 8 интервью с жителями Москвы и Санкт-Петербурга и кабинетное исследование: отзывы пользователей и сценарии 5 сервисов — Яндекс Карт, Google Maps, 2ГИС, Tripadvisor и Wanderlog. Выборка небольшая, поэтому выводы я оформила как гипотезы для юзабилити-теста."}, {"type": "cols", "items": [{"label": "ЧТО НАШЛА У КОНКУРЕНТОВ", "list": ["В Яндекс Картах список редактирует только владелец, сценария «договориться в группе» нет", "В Google Maps голосовать можно, но без срока и итога", "В трип-планерах общий список правит любой участник", "AI-подбор уже есть у Яндекса, поэтому сам чат с AI — не отличие"]}]}, {"type": "fig", "items": [["Анализ конкурентов", "img/loca_board_02.jpg"]]}, {"type": "cols", "items": [{"label": "КТО ПОЛЬЗУЕТСЯ", "text": "**Основные сегменты:** организаторы встреч, которые собирают друзей на ужин или выходные, и городские исследователи, которые ищут новое место рядом.\n\n**Вторичные:** путешественники, которые едут в другой город, и приглашенные участники, которые получили ссылку от друга и могут раньше не пользоваться LOCA.\n\nПо сегментам я собрала 4 протоперсоны, JTBD и две CJM: для поиска места и для совместной встречи."}]}, {"type": "fig", "items": [["Аудитория", "img/loca_board_01.jpg"], ["Персоны", "img/loca_board_03.jpg"]]}, {"type": "fig", "items": [["JTBD", "img/loca_board_04.jpg"], ["CJM A — поиск места", "img/loca_board_05.jpg"]]}, {"type": "heading", "num": "02", "title": "Где группа теряется"}, {"type": "p", "text": "CJM совместной встречи я построила для двух ролей сразу: организатора и приглашенной участницы. Критичные этапы — приглашение и присоединение: участник еще не пользователь LOCA, и если войти в план сложнее, чем ответить в чате, группа вернется в мессенджер. Второй риск — ожидание: план держится на самом медленном участнике."}, {"type": "fig", "items": [["CJM B — совместная встреча", "img/loca_board_06.jpg"]]}, {"type": "note", "label": "ГИПОТЕЗА 1", "text": "Если участник присоединяется по имени, без регистрации по телефону, а предпочтения заполняет за минуту, группа не уйдет обратно в чат."}, {"type": "note", "label": "ГИПОТЕЗА 2", "text": "Если у голосования есть срок, а при ничьей решает организатор, план гарантированно заканчивается решением."}, {"type": "heading", "num": "03", "title": "Решения"}, {"type": "fig", "items": [["User flow", "img/loca_board_07.jpg"], ["Инф. архитектура", "img/loca_board_08.jpg"]]}, {"type": "chain", "num": "01", "title": "Ассистент", "rows": [{"k": "Проблема", "text": "Нет идеи, куда пойти, а «уютно и тихо» фильтрами не выразить"}, {"k": "Анализ", "text": "Решающий момент — переход «Запрос → Уточнение». Если первые варианты не попали, человек возвращается в привычные карты.", "list": ["AI-подбор уже есть у Яндекса, поэтому сам чат с AI — не отличие"], "img": ["CJM A: этапы «Импульс» — «Проверка»", "img/lc_cjm_a.jpg"]}, {"k": "Вывод", "text": "**AI не продаем как отличие.** У Яндекс Карт уже есть ИИ-чат. Ценность AI в LOCA — подбор под предпочтения группы и уточнение, а не сам факт чата."}, {"k": "Решение", "text": "**Ассистент.** Запрос обычными словами или голосом, подсказки-примеры и чипсы «дешевле / ближе / тише», чтобы поправить ответ в один тап"}, {"k": "Реализация", "img": ["Ассистент: подсказки-примеры и чипсы, ответ на уточнение", "img/lc_ai.jpg"]}]}, {"type": "chain", "num": "02", "title": "Вход по имени", "rows": [{"k": "Проблема", "text": "Участнику лень ставить приложение ради одного голоса"}, {"k": "Анализ", "list": ["Ссылка выглядит как спам, непонятно, что внутри", "Участник ждет подтверждения, организатор не замечает запрос", "«Что это за приложение? Надо ставить?»"]}, {"k": "Вывод", "text": "**Вход для приглашенных — по имени.** Ссылка, имя и запрос организатору, без регистрации по номеру телефона. Чем проще присоединиться, тем реже группа уходит обратно в мессенджер."}, {"k": "Решение", "text": "**Вход по имени.** Ссылка → «Присоединиться» → имя → запрос организатору. Организатор принимает запросы на отдельном экране"}, {"k": "Реализация", "img": ["«Присоединиться» → имя; «Запросы на вступление»", "img/lc_join.jpg"]}]}, {"type": "chain", "num": "03", "title": "«Ответили 3 из 4»", "rows": [{"k": "Проблема", "text": "Один участник не отвечает, и весь план стоит"}, {"k": "Анализ", "text": "Второй риск — ожидание на этапе 05: план держится на самом медленном участнике, поэтому нужны напоминание и возможность начать без всех."}, {"k": "Вывод", "text": "«Напомнить» одному; «Показать результаты» без всех"}, {"k": "Решение", "text": "**«Ответили 3 из 4».** Организатор напоминает конкретному человеку или начинает без него"}, {"k": "Реализация", "imgs": [["Ответы группы", "img/lc_wait.jpg"]], "w": 260}]}, {"type": "chain", "num": "04", "title": "Голосование со сроком", "rows": [{"k": "Проблема", "text": "Обсуждение тянется без конца"}, {"k": "Анализ", "list": ["В Google Maps голосовать можно, но без срока и итога", "Чужие варианты удаляют без спроса; ничья; голосование тянется без срока"]}, {"k": "Вывод", "text": "**Отличие — довести решение до конца.** Голосовать в группе можно и в Google Maps, но там нет ни срока, ни итога. В LOCA голосование ограничено по времени, а при ничьей решает организатор."}, {"k": "Решение", "text": "**Голосование со сроком.** «Голосование до 23 мая, 20:00»; при ничьей решает организатор, участники видят «Ждем решения организатора»"}, {"k": "Реализация", "img": ["Голосование; ничья у участника и у организатора", "img/lc_vote.jpg"]}]}, {"type": "mini", "label": "ЕЩЁ РЕШЕНИЯ", "rows": [["Страшно прийти в закрытое или разочаровывающее место", "**Карточка места.** «Сейчас открыто до 23:00», средний чек, часы по дням, оценки по критериям и «Все отзывы» с сортировкой и фильтром «С фото»", ["Карточка места и «Все отзывы»", "img/lc_place.jpg"]], ["Найденные места теряются в скриншотах", "**Списки и планы.** «Сохранить» → «В список» или «В план»; «Избранное» — один из списков, а не отдельная свалка", ["«Сохранить»: в список или в план", "img/lc_lists.jpg"]], ["Каждый хочет свое, а решает в итоге один", "**Предпочтения группы.** Категория, бюджет, расстояние и атмосфера за минуту. В общей подборке места участников и одно, которое подбирает LOCA", ["Предпочтения и общая подборка", "img/lc_prefs.jpg"]], ["Чужие варианты удаляют без спроса", "**Права на места.** Организатор выбирает правило при создании плана. По умолчанию свое место удаляет только автор, а на чужом можно нажать «Предложить убрать»", ["Новый план: кто может удалять места; «Предложить убрать»", "img/lc_rights.jpg"]], ["Поездку компанией не с чего начать", "**Готовые маршруты.** Карточка маршрута с программой по дням, сезоном и бюджетом и кнопкой «Предложить группе»", ["Карточка маршрута", "img/lc_route.jpg"]]]}, {"type": "heading", "title": "Ключевые сценарии"}, {"type": "cols", "items": [{"label": "Личный режим", "text": "**Поиск и сохранение**\n\nАссистент → уточнение → карточка места → «Сохранить» в список → маршрут → отзыв"}, {"label": "Групповой режим", "text": "**Совместная встреча**\n\nНовый план → ссылка → присоединение → предпочтения → общая подборка → голосование → план встречи"}, {"label": "Поездки", "text": "**Маршрут по стране**\n\n«По стране» → карточка маршрута с программой по дням → «Сохранить» в план или «Предложить группе»"}]}, {"type": "heading", "title": "Дизайн"}, {"type": "cols", "items": [{"label": "ВИЗУАЛЬНЫЙ СТИЛЬ", "text": "Интерфейс темный и монохромный: темное стекло и светлые акценты, а главное место отдано фото мест. Цвет оставила только для смысла: статус «в сети», срок голосования, ошибки."}, {"label": "СИСТЕМА", "text": "Сетка под iPhone шириной 390: 16 px по краям и внутри карточек, 12 и 8 px между элементами, 24–32 px между секциями. Единый таб-бар из 5 вкладок: Главная, Карта, Ассистент, Мои места, Профиль."}]}, {"type": "chips", "label": "КРОМЕ ОСНОВНЫХ ПУТЕЙ ОТРИСОВАНЫ", "items": ["Пустое избранное", "Нет совместных планов", "Нет запросов", "Ничья", "AI не нашел места", "Нет связи", "Геолокация выключена", "Удаление аккаунта"]}, {"type": "shot", "title": "Ключевые экраны", "src": "img/v3_loca_key.jpg"}, {"type": "proto", "device": "phone", "title": "Прототип", "text": "Кликабельный прототип приложения от первого запуска: онбординг, вход по номеру, выбор города, главная, поиск, карта, ассистент, карточки мест, сохранение в список или план, «Мои места», групповой сценарий от приглашения до плана встречи и профиль с настройками. Работают таб-бар, кнопки «назад» и список всех экранов под телефоном.", "site": "LOCA", "start": "logo", "poster": "img/lc/home.jpg", "groups": [["Старт", ["logo", "onb1", "onb2", "onb3", "onb4", "login", "login2", "phone", "code1", "code2", "code3", "city", "city-search", "city-ok", "geo"]], ["Главная и поиск", [" : "note", "label": "ЧТО ПРОВЕРЮ НА ЮЗАБИЛИТИ-ТЕСТЕ", "text": "Сколько времени участник тратит от ссылки до голоса и доходит ли до конца; считает ли группа решающий голос организатора справедливым; понимают ли участники, что чужое место можно только «предложить убрать». После запуска — доля планов, доведенных до итога, и время от создания плана до решения."}], "figma": "https://www.figma.com/design/p4WzBKjIrnOcv2fBynrWJm/%D0%BF%D1%80%D0%B8%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5-%D0%B4%D0%BB%D1%8F-%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0-%D0%BC%D0%B5%D1%81%D1%82-%D0%B8-%D1%81%D0%BE%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%BD%D1%8B%D1%85-%D0%BF%D0%BB%D0%B0%D0%BD%D0%BE%D0%B2?node-id=1-3&t=W3aMiXD8CtV17xR7-1", "strips": [], "cover": "img/v3_loca_card.jpg", "shots": [], "photos": [], "boards": [], "coverVideo": {"src": "img/loca_tour.mp4", "poster": "img/loca_tour.jpg", "l": 37.4167, "t": 9.25, "w": 25.0833, "h": 81.5, "r": "11.6%/5.4%"}, "videos": []}, {"slug": "sweety", "name": "Sweety", "industry": "Fashion e-commerce", "url": null, "kicker": "КЕЙС · FASHION E-COMMERCE · B2C", "title": "Sweety: первый канал продаж для бренда одежды", "lead": "За 3 недели спроектировала и собрала интернет-магазин бренда одежды изо льна и купры. Покупательница сама выбирает вещь, подбирает размер и оплачивает заказ онлайн, а страх ошибиться с размером и не получить заказ вовремя снимается ещё до оплаты.", "desc": "За 3 недели спроектировала и собрала интернет-магазин бренда одежды изо льна и купры.", "pairs": [["Срок", "3 недели"], ["Формат", "B2C"]], "blocks": [{"type": "meta", "items": [{"label": "РОЛЬ", "value": "Единственный дизайнер: исследование, IA, user flow, прототипы, UI, UI-кит, сборка на Tilda, подключение оплаты"}, {"label": "СРОК", "value": "3 недели от исследования до запуска"}, {"label": "ПЛАТФОРМЫ", "value": "Десктоп, планшет, мобильный · Figma, Tilda"}]}, {"type": "cols", "items": [{"label": "КОНТЕКСТ", "text": "Sweety шьёт женскую одежду из натуральных тканей. У бренда не было ни сайта, ни продаж в соцсетях, ни маркетплейсов, поэтому магазин должен был стать первым и единственным каналом продаж. Своей аудитории у бренда тоже ещё не было."}, {"label": "ЗАДАЧА", "text": "Запустить магазин, где покупательница сама выбирает вещь, подбирает размер и оплачивает заказ онлайн. Успех бизнес мерил оплаченными заказами, поэтому каждое решение я проверяла вопросом: приближает ли оно к оплате."}]}, {"type": "heading", "title": "Как я решила задачу"}, {"type": "steps", "items": [{"num": "01", "title": "Взяла стандарт крупных брендов", "text": "Покупательницы уже привыкли к определённым решениям. Маленькому бренду их нужно закрыть, а выделяться тканями и атмосферой"}, {"num": "02", "title": "Нашла два главных страха", "text": "Не угадать размер и не получить заказ до поездки"}, {"num": "03", "title": "Сняла их до оплаты", "text": "Замеры, возврат и срок доставки видны в карточке и корзине, а не после покупки"}]}, {"type": "heading", "num": "01", "title": "Стандарт рынка"}, {"type": "p", "text": "Сайта и аналитики ещё не было, на интервью не хватало срока, поэтому исследование было кабинетным. Я разобрала 6 fashion-магазинов: Lichi, LIME, Post Post Scriptum, Zara, lovegoods и takeyourmuse. Сегменты, персоны и CJM оформила как гипотезы для проверки на юзабилити-тестах."}, {"type": "cols", "items": [{"label": "ЧТО ЖДУТ ПОКУПАТЕЛЬНИЦЫ", "list": ["Размерная сетка прямо в карточке", "Понятные условия доставки и возврата", "Рекомендации, чтобы собрать образ целиком", "Избранное, чтобы отложить вещь"]}]}, {"type": "fig", "items": [["Бенчмарк UX-паттернов", "img/sweety_board_02.jpg"]]}, {"type": "note", "label": "ВЫВОД", "text": "Крупные fashion-бренды задали стандарт: размерная сетка прямо в карточке, понятные доставка и возврат, рекомендации для сборки образа, избранное. Небольшому бренду не нужно изобретать новое — нужно закрыть те же ожидания, а выделиться тканями и атмосферой лукбука."}, {"type": "cols", "items": [{"label": "КТО ПОКУПАЕТ", "text": "**Основные сегменты:** женщины, которые собирают лёгкий гардероб в отпуск в жаркие страны, и стилисты, которые подбирают одежду для съёмок.\n\n**Вторичный:** женщины, которым нужна базовая одежда из натуральных тканей на лето в городе. Его критерии пересекаются с основными, поэтому отдельную персону я не делала."}]}, {"type": "fig", "items": [["Аудитория", "img/sweety_board_01.jpg"], ["Персоны", "img/sweety_board_03.jpg"]]}, {"type": "heading", "num": "02", "title": "Два страха на пути к оплате"}, {"type": "p", "text": "Я описала задачи покупательниц через JTBD и построила CJM для основной персоны, которая собирает гардероб к отпуску. Эмоции проседают дважды: когда она выбирает размер и когда думает, успеет ли заказ прийти до вылета."}, {"type": "fig", "items": [["JTBD", "img/sweety_board_04.jpg"], ["CJM", "img/sweety_board_05.jpg"]]}, {"type": "note", "label": "ГИПОТЕЗА", "text": "Если показать замеры, условие возврата и срок доставки до оплаты, покупательница не будет откладывать решение и дойдёт до оплаты."}, {"type": "heading", "num": "03", "title": "Решения"}, {"type": "fig", "items": [["User flow", "img/sweety_board_06.jpg"], ["Инф. архитектура", "img/sweety_board_07.jpg"]]}, {"type": "chain", "num": "01", "title": "Размер до корзины", "rows": [{"k": "Проблема", "text": "Страх не угадать размер"}, {"k": "Анализ", "list": ["«А если не подойдет размер?»", "Страх не угадать размер и не вернуть вещь"], "img": ["CJM: этапы «Выбор образов» — «Доставка»", "img/sw_cjm_dips.jpg"]}, {"k": "Вывод", "text": "Размер — до корзины. Замеры в сантиметрах доступны в один клик из карточки."}, {"k": "Решение", "text": "**Размерная сетка в панели карточки.** Замеры в сантиметрах видны без перехода, а выбранные цвет и размер не сбрасываются"}, {"k": "Реализация", "img": ["Размерная сетка в панели карточки", "img/sw_sizegrid.jpg"]}]}, {"type": "chain", "num": "02", "title": "Срок доставки до оплаты", "rows": [{"k": "Проблема", "text": "Непонятно, успеет ли заказ к поездке"}, {"k": "Анализ", "list": ["«Успеют до вылета?»", "Риск не успеть получить до вылета"], "img": ["JTBD: «до вылета осталось мало времени»", "img/sw_jtbd_trip.jpg"]}, {"k": "Вывод", "text": "Срок доставки заранее. 3–14 дней СДЭК и Яндекс Go для срочных заказов по Москве."}, {"k": "Решение", "text": "**Срок доставки до оплаты.** Срок по России и срочная доставка по Москве видны ещё до оформления"}, {"k": "Реализация", "img": ["Оформление заказа: доставка", "img/sw_delivery.jpg"]}]}, {"type": "chain", "num": "03", "title": "Возврат без сюрпризов", "rows": [{"k": "Проблема", "text": "Неприятный сюрприз после покупки"}, {"k": "Анализ", "text": "Понятные условия доставки и возврата"}, {"k": "Вывод", "text": "Возврат — без сюрпризов. Если вещь не подлежит возврату, как топы, это видно в карточке."}, {"k": "Решение", "text": "**Условие возврата рядом с кнопкой «В корзину».** Топы относятся к бельевым изделиям и не подлежат возврату, и покупательница знает это заранее"}, {"k": "Реализация", "img": ["Карточка товара: условие возврата под кнопкой", "img/sw_return.jpg"]}]}, {"type": "chain", "num": "04", "title": "Лукбук с вещами образа", "rows": [{"k": "Проблема", "text": "Вдохновение не превращается в покупку"}, {"k": "Анализ", "list": ["«Что с чем носить?»", "Сложно собрать гардероб из разных образов", "Рекомендации, чтобы собрать образ целиком"]}, {"k": "Вывод", "text": "Образ, а не вещь. Лукбук и рекомендации под карточкой ведут от вдохновения к покупке."}, {"k": "Решение", "text": "**Лукбук с вещами образа.** Каждый образ раскладывается на вещи с ценами, и из него можно сразу перейти к покупке"}, {"k": "Реализация", "img": ["Лукбук", "img/sw_lookbook.jpg"]}]}, {"type": "mini", "label": "ЕЩЁ РЕШЕНИЯ", "rows": [["Корзина-страница уводит из каталога", "**Корзина — боковая панель.** Видно, что вещь добавилась, а покупательница остаётся в каталоге и продолжает собирать образ", ["Корзина — боковая панель", "img/sw_cart.jpg"]], ["У нового бренда нет своей аудитории", "**Подписка со скидкой.** Собирает базу контактов для повторных продаж. Шкала в корзине показывает, сколько осталось до бесплатной доставки от 15 000 ₽", ["Попап подписки", "img/sw_subscribe.jpg"]], ["Ошибка обрывает покупку", "**Понятные состояния.** Подсказка, если не выбран размер. Ошибки под полями формы. При неудачной оплате заказ сохраняется. Из пустых корзины и избранного можно перейти в каталог", ["Оплата не прошла", "img/sw_error.jpg"]]]}, {"type": "heading", "title": "Дизайн и UI-кит"}, {"type": "cols", "items": [{"label": "ВИЗУАЛЬНЫЙ СТИЛЬ", "text": "Логотип дала заказчица, остальной стиль я сделала сама. В основе чёрно-белая нейтральная база и заголовки шрифтом с засечками, а цвет дают фото коллекции и сама одежда. Вместо промо-баннеров крупные фото: бренд выделяется тканями и атмосферой, а не скидками. В каталоге фото в полный рост, чтобы посадку было видно без перехода в карточку."}, {"label": "СИСТЕМА И СБОРКА", "text": "В Figma я собрала UI-кит: цвета с ролями, типографику, сетку и отступы, компоненты с состояниями. Все страницы спроектированы для десктопа, планшета и телефона. На Tilda сайт собран точно по макетам, включая корзину-панель и панель с размерной сеткой. Лукбук пересобрали на итерации: вместо чередования чёрно-белых и цветных фото по решению заказчицы остались только цветные."}]}, {"type": "chips", "label": "ОТРИСОВАНЫ НЕ ТОЛЬКО ОСНОВНОЙ ПУТЬ, НО И", "items": ["Пустая корзина", "Пустое избранное", "Нет в наличии", "Ошибки формы", "Неверный промокод", "Оплата не прошла", "404"]}, {"type": "shot", "title": "Ключевые экраны", "src": "img/v3_sweety_key.jpg"}, {"type": "proto", "title": "Прототип", "text": "Кликабельный прототип магазина: каталог, карточка с размерной сеткой, корзина-панель, оформление и успешный заказ, избранное, лукбук и попап подписки. Кликайте по меню, товарам и кнопкам.", "site": "sweety.store", "start": "home", "poster": "img/sw/home.jpg", "screens": {"home": {"img": "img/sw/home.jpg", "w": 1366, "h": 3462, "path": "", "hs": [[1.098, 0.52, 9.517, 1
