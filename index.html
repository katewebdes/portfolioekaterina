   `<div class="pv-acc" style="min-height:${u(a.y1-a.y0)};padding-left:${u(x0)};background-color:${a.bg||'#fff'}"><div class="pv-accl" style="width:${u(x0)};height:${u(a.y1-a.y0)};background-image:url('${sc.img}');background-size:100cqw auto;background-position:0 ${pvU(sc,-a.y0)}"></div>${body}</div>`+
   `${pvSlice(sc,a.y1,H,alt,hs(a.y1,H)+ov(a.y1,H))}</div>`}
function pvWire(view,sc){view.querySelectorAll('.vchip').forEach(c=>c.onclick=e=>{e.stopPropagation();view.querySelectorAll('.vchip').forEach(x=>x.classList.toggle('on',x===c));const i=c.dataset.i;view.querySelectorAll('.vcard').forEach(d=>d.classList.toggle('off',i!=='0'&&!d.dataset.c.split(' ').includes(i)))});
  view.querySelectorAll('.vchk').forEach(c=>c.onclick=e=>{e.stopPropagation();const on=c.classList.toggle('on');c.setAttribute('aria-pressed',on)});
  view.querySelectorAll('.vfaq').forEach(c=>c.onclick=e=>{e.stopPropagation();const on=c.classList.toggle('on');c.setAttribute('aria-expanded',on)})}
function pvInit(root){root.querySelectorAll('.pv').forEach(el=>{const b=PV[+el.id.slice(2)];if(!b)return;const view=el.querySelector('.pv-view'),url=el.querySelector('.pv-url'),back=el.querySelector('.pv-back');let hist=[];
  let tm,tt;function toast(m){let n=el.querySelector('.pv-toast');if(!n){n=document.createElement('div');n.className='pv-toast';n.setAttribute('role','status');el.appendChild(n)}n.textContent=m;n.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>n.classList.remove('on'),2600)}
  function goBack(){if(hist.length){const k=hist.pop();show(k,false);back.disabled=!hist.length}else show(b.start,false)}
  function show(k,push){if(k==='back')return goBack();const sc=b.screens[k];if(!sc)return;clearTimeout(tm);if(push&&el.dataset.cur)hist.push(el.dataset.cur);el.dataset.cur=k;back.disabled=!hist.length;{const pk=el.querySelector('.pv-pick');if(pk)pk.value=k}url.textContent=b.device?b.site+' · '+sc.path:b.site+(sc.path?'/'+sc.path:'');if(sc.auto)tm=setTimeout(()=>{if(el.dataset.cur===k)show(sc.auto[0],false)},sc.auto[1]);
    view.innerHTML=pvRender(sc,b.site+': '+k);view.scrollTop=0;pvWire(view,sc);
    view.querySelectorAll('.hs').forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();const t=a.dataset.to;if(t[0]==='!'){toast(t.slice(1));return}t[0]==='~'?show(t.slice(1),false):show(t,true)});
    view.querySelector('.pv-page').onclick=()=>{const p=view.querySelector('.pv-page');p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash')};}
  el.querySelector('.proto-start').onclick=()=>show(b.start,false);const pk=el.querySelector('.pv-pick');if(pk)pk.onchange=()=>show(pk.value,true);
  back.onclick=goBack;
  el.querySelector('.pv-home').onclick=()=>show(b.start,!!el.dataset.cur);});}
let tab='cases';
const P=walk(P0),CASES=CASES0.map(c=>walk(c));

function themeInit(){let t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}document.documentElement.dataset.theme=t}
function themeToggle(){const r=document.documentElement;const t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}

function card(c,i){
  const pairs=c.pairs.map(p=>`<div><div class="pair-l">${esc(p[0])}</div><div class="pair-v">${esc(p[1])}</div></div>`).join('');
  const site=(c.url?`<a class="pill sm site" href="https://${esc(c.url)}" target="_blank" rel="noopener">Открыть сайт ↗</a>`:'')+(c.figma?`<a class="pill sm site" href="${esc(c.figma)}" target="_blank" rel="noopener">Figma ↗</a>`:'');
  return `<article class="card" data-i="${i}">
    <div class="cover"><div class="cvw"><img src="${c.cover}" alt="${esc(c.name)}: обложка кейса" loading="${i<2?'eager':'lazy'}">${c.coverVideo?ovv(c.coverVideo):''}</div></div>
    <div class="card-body">
      <div class="card-head"><h2 class="card-title">${esc(c.name)} <span>· ${esc(c.industry)}</span></h2>${site}</div>
      <p class="card-desc">${esc(c.desc)}</p>
      <div class="card-foot"><div class="pairs">${pairs}</div><a class="pill sm open" href="#${c.slug}">Смотреть кейс ›</a></div>
    </div></article>`;
}
function about(){
  const xp=P.experience.map(e=>`<div><h3>${esc(e.title)}</h3>${list(e.points)}</div>`).join('');
  const edu=P.education.map(e=>`<div class="xp-row"><div><b>${esc(e.title)}</b>${e.note?`<p class="t" style="color:var(--fg2)">${esc(e.note)}</p>`:''}</div><span>${esc(e.year)}</span></div>`).join('');
  const skills=P.skills.map(s=>`<div><b>${esc(s[0])}</b><p style="color:var(--fg2)">${esc(s[1])}</p></div>`).join('');
  return `<div class="about">
    <section class="panel rise"><div class="label">О себе</div><p>${esc(P.about)}</p><div class="xp-row" style="margin-top:16px;flex-wrap:wrap;gap:8px 24px"><span style="color:var(--fg2)">${esc(P.location)}</span><span style="color:var(--fg2);user-select:all">${esc(P.email)}</span><a href="${P.telegram}" target="_blank" rel="noopener" style="color:inherit">Telegram ${esc(P.tg)}</a></div></section>
    <section class="panel rise"><div class="label">Опыт</div><div class="xp-row" style="margin-bottom:16px"><b>${esc(P.job)}</b><span>${esc(P.jobYears)}</span></div><div class="xp">${xp}<p style="color:var(--fg2)">${esc(P.other)}</p></div></section>
    <section class="panel rise"><div class="label">Учебный проект</div><div class="xp-row" style="margin-bottom:16px"><b>${esc(P.study.title)}</b><span>${esc(P.study.year)}</span></div>${list(P.study.points)}</section>
    <section class="panel rise"><div class="label">Образование</div><div class="xp">${edu}</div></section>
    <section class="panel rise"><div class="label">Навыки</div><div class="xp">${skills}</div></section>
  </div>`;
}
function home(){
  const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
  app.innerHTML=`<div class="home">
    <aside class="profile">
      <div class="profile-top"><img class="avatar" src="${P.photo}" alt="${esc(P.name)}"><button class="icon-btn" id="theme" type="button" aria-label="Переключить тему">${sun}</button></div>
      <div><h1 class="name">${esc(P.name)}</h1><div class="role">${esc(P.role)}</div></div>
      <p class="bio">${esc(P.bio)}</p>
      <div class="btns"><a class="pill primary" href="${P.telegram}" target="_blank" rel="noopener">Telegram</a><button class="pill" data-cv type="button">CV</button></div>
    </aside>
    <section>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="cases" aria-selected="${tab==='cases'}">Кейсы <small>${CASES.length}</small></button>
        <button class="tab" role="tab" data-t="about" aria-selected="${tab==='about'}">Обо мне</button>
      </div>
      <div id="tabc">${tab==='cases'?`<div class="feed">${CASES.map(card).join('')}</div>`:about()}</div>
    </section></div>`;
  document.getElementById('theme').onclick=themeToggle;
  app.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{openLb('img/v3_u_acb82d9f.jpg');lb.classList.add('cv')});
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});
  autoplay(app);
  const cards=[...app.querySelectorAll('.card')];
  if(!('IntersectionObserver' in window)){return}
  const vh=window.innerHeight;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
  cards.forEach(c=>{if(c.getBoundingClientRect().top<vh){c.classList.add('rise')}else{c.classList.add('wait');io.observe(c)}});
}
function block(b){
  switch(b.type){
    case 'meta': return `<div class="grid">${b.items.map(i=>`<div class="cell"><div class="label">${esc(i.label)}</div><p class="v">${md(i.value)}</p></div>`).join('')}</div>`;
    case 'cols': return `<div class="grid">${b.items.map(i=>`<div class="cell">${i.label?`<div class="label">${esc(i.label)}</div>`:''}${i.title?`<p class="step-t">${md(i.title)}</p>`:''}${i.text?paras(i.text):''}${i.list?list(i.list):''}${i.after?paras(i.after):''}</div>`).join('')}</div>`;
    case 'heading': return `<h2 class="h2">${b.num?`<i>${esc(b.num)}</i>`:''}${md(b.title)}</h2>`;
    case 'p': return paras(b.text,'para');
    case 'steps': return `<div class="grid">${b.items.map(i=>`<div class="cell"><div class="step-n">${esc(i.num||'')}</div><p class="step-t">${md(i.title)}</p>${i.text?paras(i.text):''}</div>`).join('')}</div>`;
    case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'stats': return `<div class="grid">${b.items.map(i=>`<div class="cell"><div class="stat-v">${esc(i.value)}</div><p class="t">${md(i.label)}</p></div>`).join('')}</div>`;
    case 'chips': return `<div class="cell">${b.label?`<div class="label">${esc(b.label)}</div>`:''}<div class="chips">${b.items.map(i=>`<span class="chip">${md(i)}</span>`).join('')}</div></div>`;
    case 'fig': return `<div class="figs">${b.items.map(fg).join('')}</div>`;
    case 'proto': {const id='pv'+(PV.length);PV.push(b);return `<h2 class="h2">${esc(b.title)}</h2><p class="para">${md(b.text||'')}</p><div class="pv${b.device?' pv-'+b.device:''}" id="${id}"><div class="pv-bar"><span class="pv-dots"><i></i><i></i><i></i></span><button class="pv-back" type="button" aria-label="Назад" disabled>‹</button><span class="pv-url">${esc(b.site)}</span>${b.groups?`<select class="pv-pick" aria-label="Перейти к экрану">${b.groups.map(g=>`<optgroup label="${esc(g[0])}">${g[1].map(k=>`<option value="${k}">${esc(b.screens[k].path)}</option>`).join('')}</optgroup>`).join('')}</select>`:''}<button class="pv-home" type="button">На главную</button></div><div class="pv-view"><button class="proto-start" type="button" aria-label="Запустить прототип"><img src="${b.poster}" alt="" loading="lazy"><span>▶ Запустить прототип</span></button></div></div><p class="capnote pv-note">Подсказка: клик мимо кнопок подсветит все кликабельные зоны.</p>`;}
    case 'shot': return `<h2 class="h2">${esc(b.title)}</h2><div class="shot${b.ov?' has-ov':''}"><img src="${b.src}" alt="${esc(b.title)}" loading="lazy">${b.ov?[].concat(b.ov).map(ovv).join(''):''}</div>`;
    case 'chain': {const K=['Проблема','Анализ','Вывод','Решение','Реализация'];return `<div class="chain"><div class="chain-h"><div class="step-n">${esc(b.num)}</div><h3 class="step-t">${esc(b.title)}</h3></div>${b.rows.map(r=>`<div class="crow${r.k==='Реализация'?' res':''}"><div class="k">${esc(r.k)}</div><div>${r.text?paras(r.text):''}${r.list?list(r.list):''}${r.img?fg(r.img):''}${r.imgs?`<div class="figs sm" style="--w:${r.w||160}px">${r.imgs.map(fg).join('')}</div>`:''}</div></div>`).join('')}</div>`;}
    case 'mini': return `<div class="mini">${b.label?`<div class="label" style="margin:8px 0 0">${esc(b.label)}</div>`:''}${b.rows.map(r=>`<div class="cell"><div><div class="label">Проблема</div><p class="t">${md(r[0])}</p><div class="label" style="margin-top:14px">Решение</div><p>${md(r[1])}</p></div>${fg(r[2])}</div>`).join('')}</div>`;
    case 'note': return `<div class="cell note">${b.label?`<div class="label">${esc(b.label)}</div>`:''}${paras(b.text)}</div>`;
    default: return '';
  }
}
function fg(i){return `<figure><button type="button" data-src="${i[1]}" aria-label="Открыть: ${esc(i[0])}"><img src="${i[1]}" alt="${esc(i[0]||'Фото с площадки')}" loading="lazy" decoding="async"></button>${i[0]?`<figcaption>${esc(i[0])}</figcaption>`:""}</figure>`}
function ovv(v){if(Array.isArray(v))return v.map(ovv).join("");if(v.img)return `<img class="ov" src="${v.img}" alt="" aria-hidden="true" style="left:${v.l}%;top:${v.t}%;width:${v.w}%;height:${v.h}%">`;return `<video class="ov" data-auto src="${v.src}" poster="${v.poster}" muted loop playsinline preload="metadata" aria-hidden="true" style="left:${v.l}%;top:${v.t}%;width:${v.w}%;height:${v.h}%;border-radius:${v.r}"></video>`}
function autoplay(root){root.querySelectorAll('video[data-auto],.vids video').forEach(v=>{v.muted=true;new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?v.play().catch(()=>{}):v.pause())).observe(v)})}
function caseView(c){
  const site=`<div class="nav-r">${c.url?`<a class="pill sm" href="https://${esc(c.url)}" target="_blank" rel="noopener">Открыть сайт ↗</a>`:''}${c.figma?`<a class="pill sm" href="${esc(c.figma)}" target="_blank" rel="noopener">Макеты в Figma ↗</a>`:''}</div>`;
  const strips=(c.strips||[]).map(s=>`<h2 class="h2">${esc(s.title)}</h2>${s.kind==='cap'?'<p class="capnote">Длинные экраны показаны сверху, целиком открываются по клику</p>':''}<div class="${s.kind==='wide'?'wide':s.kind==='cap'?'strip cap':'strip'}" style="--w:${s.w||220}px">${s.items.map(i=>`<figure><img src="${i[1]}" data-src="${i[1]}" alt="${esc(c.name)}: ${esc(i[0])}" loading="lazy"><figcaption>${esc(i[0])}</figcaption></figure>`).join('')}</div>`).join('');
  const shots=c.shots.map(s=>`<h2 class="h2">${esc(s[0])}</h2><div class="shot"><img src="${s[1]}" alt="${esc(c.name)}: ${esc(s[0]).toLowerCase()}" loading="lazy"></div>`).join('');
  const vids=(c.videos||[]).length?`<h2 class="h2">Прототип в работе</h2><div class="vids">${c.videos.map(v=>`<figure style="--ar:${v[2]}"><video src="${v[1]}" poster="${v[3]}" autoplay muted loop playsinline preload="metadata" aria-label="${esc(v[0])}"></video><figcaption>${esc(v[0])}</figcaption></figure>`).join('')}</div>`:'';
  const photos=c.photos.length?`<h2 class="h2">Фото с площадки</h2><div class="photos">${c.photos.map(p=>`<img src="${p}" alt="${esc(c.name)}: фото с площадки" loading="lazy">`).join('')}</div>`:'';
  const boards=c.boards.length?`<h2 class="h2">Исследование и проектирование</h2><div class="boards">${c.boards.map(b=>`<button class="board" type="button" data-src="${b[1]}"><img src="${b[1]}" alt="${esc(b[0])}" loading="lazy"><span>${esc(b[0])}</span></button>`).join('')}</div>`:'';
  const others=CASES.filter(x=>x!==c).map(x=>`<a href="#${x.slug}"><div class="cell"><p class="step-t">${esc(x.name)}</p><p class="t">${esc(x.industry)}</p></div></a>`).join('');
  app.innerHTML=`<article class="case rise">
    <div class="case-nav"><a class="pill sm" href="#home">‹ Все кейсы</a>${site}</div>
    <header><div class="kicker">${esc(c.kicker)}</div><h1>${esc(c.title)}</h1><p class="lead">${esc(c.lead)}</p></header>
    <div class="shot${c.coverVideo?' has-ov':''}"><img src="${c.cover}" alt="${esc(c.name)}: обложка кейса">${c.coverVideo?ovv(c.coverVideo):''}</div>
    ${c.blocks.map(block).join('')}
    ${photos}${shots}${vids}${strips}${boards}
    <h2 class="h2">Другие проекты</h2><div class="next">${others}</div>
  </article>`;
  autoplay(app);
  app.querySelectorAll('.board,.strip img,.wide img,.figs button,.chain button,.mini button').forEach(b=>b.onclick=()=>openLb(b.dataset.src));
  pvInit(app);
}
const lb=document.getElementById('lb');
function openLb(src){lb.classList.remove('cv');lb.querySelector('img').src=src;lb.hidden=false;lb.scrollTop=0}
lb.onclick=()=>{lb.hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
function route(){
  const h=(location.hash||'').slice(1);const c=CASES.find(x=>x.slug===h);
  if(c){caseView(c);window.scrollTo(0,0)}else{home()}
}
themeInit();
document.getElementById('f-who').textContent=P.name+' · '+P.role;
document.getElementById('f-links').innerHTML=`<a href="${P.telegram}" target="_blank" rel="noopener">Telegram ↗</a><a href="mailto:${P.email}">${esc(P.email)}</a>`;
window.addEventListener('hashchange',route);
route();
</script>
